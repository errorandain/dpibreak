name: Build APK

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (с сабмодулями)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Gradle wrapper уже в репозитории (gradlew + gradle/wrapper).
      # Действие лишь кеширует дистрибутив Gradle между сборками.
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # Согласие с лицензиями Android SDK и установка нужной платформы (API 35)
      # (на облачных серверах GitHub Android SDK есть, но не со всеми версиями)
      - name: Setup Android SDK (API 35)
        run: |
          # Определяем путь к sdkmanager
          if [ -n "$ANDROID_HOME" ] && [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMGR="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          elif [ -n "$ANDROID_HOME" ]; then
            SDKMGR="$(find "$ANDROID_HOME" -name "sdkmanager" -type f 2>/dev/null | head -n1)"
          fi
          
          # Если sdkmanager не найден — устанавливаем cmdline-tools
          if [ -z "$SDKMGR" ] || [ ! -x "$SDKMGR" ]; then
            echo "sdkmanager not found, installing cmdline-tools..."
            mkdir -p "$ANDROID_HOME/cmdline-tools"
            cd "$ANDROID_HOME/cmdline-tools"
            curl -o cmdline-tools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            unzip -q cmdline-tools.zip
            mv cmdline-tools latest
            rm cmdline-tools.zip
            SDKMGR="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          fi
          
          echo "Using sdkmanager: $SDKMGR"
          yes | "$SDKMGR" --licenses > /dev/null 2>&1 || true
          "$SDKMGR" "platforms;android-35" "build-tools;35.0.0" > /dev/null

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: dpibreak-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
