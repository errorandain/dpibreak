name: Build APK

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (с сабмодулями)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Gradle wrapper уже в репозитории (gradlew + gradle/wrapper).
      # Действие лишь кеширует дистрибутив Gradle между сборками.
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # NDK и CMake входят в образ ubuntu-latest; если сборка упадёт с их отсутствием,
      # раскомментируйте:
      # - name: Install NDK & CMake
      #   run: yes | sdkmanager --licenses && sdkmanager "ndk;27.0.12077973" "cmake;3.22.1"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: dpibreak-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
