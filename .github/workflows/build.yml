name: Build APK

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (с сабмодулями)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Gradle wrapper уже в репозитории (gradlew + gradle/wrapper).
      # Действие лишь кеширует дистрибутив Gradle между сборками.
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # Согласие с лицензиями Android SDK и установка нужной платформы (API 35)
      # (на облачных серверах GitHub Android SDK есть, но не со всеми версиями)
      - name: Setup Android SDK (API 35)
        run: |
          SDKMGR="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMGR" ]; then
            SDKMGR="$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -n1)"
          fi
          yes | "$SDKMGR" --licenses > /dev/null 2>&1 || true
          "$SDKMGR" "platforms;android-35" > /dev/null

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: dpibreak-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
